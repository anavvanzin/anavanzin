name: Estudar accessibility
on:
  pull_request:
    paths:
      - 'apps/estudar/**'
      - 'estudar/**'
      - 'tests/estudar-accessibility.spec.js'
      - '.github/workflows/estudar-accessibility.yml'
  push:
    branches: [main]
    paths:
      - 'apps/estudar/**'
      - 'estudar/**'
      - 'tests/estudar-accessibility.spec.js'
      - '.github/workflows/estudar-accessibility.yml'
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/estudar/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/estudar
      - run: npm run build --prefix apps/estudar
      - name: Published bundle matches source, templates remain intact
        run: diff -r apps/estudar/dist estudar
      - name: Lint navigation
        working-directory: apps/estudar
        run: npx eslint src/App.tsx
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/estudar-accessibility.spec.js --workers=1
