name: Pages release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Test the Pages artifact and isolated local KV
        shell: bash
        run: |
          node_modules/.bin/wrangler dev --config tests/fixtures/iconocracia-work/wrangler.jsonc --local --port 8102 --ip 127.0.0.1 --show-interactive-dev-session=false > "$RUNNER_TEMP/pages-service.log" 2>&1 &
          service_pid=$!
          node_modules/.bin/wrangler pages dev .worker-assets --kv MESAS --service ICONOCRACIA_WORK=pages-iconocracia-fixture --port 8101 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/pages-state" --show-interactive-dev-session=false > "$RUNNER_TEMP/pages-runtime.log" 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" "$service_pid"; wait "$pages_pid" "$service_pid" || true' EXIT
          timeout 30s bash -c 'until curl --silent --fail http://127.0.0.1:8102/ > /dev/null; do sleep 1; done'
          timeout 30s bash -c 'until curl --silent --fail http://127.0.0.1:8101/ > /dev/null; do sleep 1; done'
          npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages:ui
